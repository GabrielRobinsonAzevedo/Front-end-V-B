<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrinho de Compras</title>
    <link rel="stylesheet" href="styles.css">
    <script src="logica.js" defer></script>

</head>
<body>
    <header>
        <h1><a href="index.html">Carrinho de compras</a></h1>
        <div class="botoesCabecalho">
            <button class="carrinhoCompras"><img src="assets/cart-shopping-svgrepo-com.svg" alt="Carrinho de compras" width="50"></button>
            <button class="entrar"><a href="login.html">Log in</a></button>
        </div>
    </header>

    <main id="conteudo">
        <section id="listaCompras"></section>
        
        <section id="valorTotal">
            <p>Total estimado</p>
            <h3 id="valorMensal">R$ 1499,00/mês</h3>
            <h3 id="valorAvulso">R$ 49,90</h3>
            
            <div id="dadosCheckout" style="display:none">
                <div id="campoEmail" class="grupoInputCheckout" style="display:none">
                    <label for="emailCheckout">E-mail</label>
                    <input type="email" id="emailCheckout" placeholder="seu@email.com">
                </div>

                <div class="grupoInputCheckout">
                    <label for="cpfCnpj">CPF / CNPJ</label>
                    <input type="text" id="cpfCnpj" placeholder="000.000.000-00">
                </div>

                <span class="separadorCheckout">Dados do cartão (simulação)</span>

                <div class="grupoInputCheckout">
                    <label for="nomeTitular">Nome no cartão</label>
                    <input type="text" id="nomeTitular" placeholder="NOME SOBRENOME">
                </div>
                <div class="grupoInputCheckout">
                    <label for="numeroCartao">Número do cartão</label>
                    <input type="text" id="numeroCartao" placeholder="0000 0000 0000 0000" maxlength="19">
                </div>
                <div class="grupoInputDuplo">
                    <div class="grupoInputCheckout">
                        <label for="validadeCartao">Validade</label>
                        <input type="text" id="validadeCartao" placeholder="MM/AA" maxlength="5">
                    </div>
                    <div class="grupoInputCheckout">
                        <label for="cvvCartao">CVV</label>
                        <input type="text" id="cvvCartao" placeholder="000" maxlength="3">
                    </div>
                </div>
            </div>

            <button id="pagamento">Continuar para o pagamento</button>
        </section>    
    </main>

    <section id="pagamentoAnimacao">
        <h3>pagamento sendo realizado.</h3>
        <div class="barraProgresso"><div class="progresso"></div></div>
        <button class="fecharPagamaneto" disabled>fechar</button>
    </section>
</body>
</html>
