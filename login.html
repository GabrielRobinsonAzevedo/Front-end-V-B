<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conecta Mídia - Log In</title>
    <link rel="stylesheet" href="styles.css">
    <script src="logica.js" defer></script>
</head>
<body>
    <header>
        <h1><a href="index.html">Log in</a></h1>
        <div class="botoesCabecalho">
            <button class="carrinhoCompras"><a href="shoppingCart.html"><img src="assets/cart-shopping-svgrepo-com.svg" alt="Carrinho de compras" width="50"></a></button>
            <button class="entrar"><a href="login.html">Log in</a></button>
        </div>
    </header>

    <main class="containerAutenticacao">
        <div class="cardFormulario">
            <h2>Log in</h2>
            <hr class="linhaDivisoria">

            <form id="gerenciamentoDeConta">
                <div class="grupoInput">
                    <label for="email">E-mail</label>
                    <input type="email" name="email" id="email" required autocomplete="username">
                </div>
                
                <div class="grupoInput">
                    <label for="senha">Senha:</label>
                    <input type="password" name="password" id="senha" required autocomplete="current-password">
                </div>
                
                <button type="submit" id="entrarNaConta" class="botaoSucesso">Log in</button>
            </form>
        </div>
    </main>
</body>
</html>
